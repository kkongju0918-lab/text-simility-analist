<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Semantic Network Similarity Lab</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>

<style>

body{
    font-family:'Malgun Gothic',sans-serif;
    background:#f8fafc;
    margin:0;
    padding:30px;
    color:#1e293b;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

.container{
    display:grid;
    grid-template-columns:400px 1fr;
    gap:25px;
}

.panel{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.input-group{
    margin-bottom:18px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

textarea{
    width:100%;
    height:110px;
    resize:none;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:12px;
    box-sizing:border-box;
    font-size:14px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#10b981;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#059669;
}

#cy{
    width:100%;
    height:520px;
    background:white;
    border-radius:16px;
    border:1px solid #e2e8f0;
}

.result-box{
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border-bottom:1px solid #e2e8f0;
    padding:12px;
    text-align:center;
    word-break:break-word;
}

th{
    background:#f1f5f9;
}

.highlight{
    color:#10b981;
    font-weight:bold;
    font-size:16px;
}

.notice{
    margin-top:10px;
    color:#64748b;
    font-size:13px;
}

</style>
</head>

<body>

<h1>AI 텍스트 유사도 vs 구조 기반 의미 유사도</h1>

<p>
PageRank 기반 단어 네트워크를 활용하여 기존 코사인 유사도의 한계를 보완합니다.
</p>

<div class="container">

<div class="panel">

<div class="input-group">
<label>1번 문장 (영어 가능)</label>
<textarea id="text1">You are the salt of the earth.</textarea>
</div>

<div class="input-group">
<label>2번 문장</label>
<textarea id="text2">너희는 세상의 소금이다.</textarea>
</div>

<div class="input-group">
<label>3번 문장</label>
<textarea id="text3">너희는 세상에 꼭 필요한 존재다.</textarea>
</div>

<button onclick="analyzeTexts()">
유사도 분석 시작
</button>

<div class="notice">
※ 영어 문장은 내부적으로 자동 번역 후 분석됩니다.
</div>

</div>

<div>

<div id="cy"></div>

<div class="panel result-box">

<h3>유사도 비교 결과</h3>

<table>

<thead>
<tr>
<th>비교 대상</th>
<th>기존 코사인 유사도</th>
<th>PageRank 보정 유사도</th>
</tr>
</thead>

<tbody id="resultTable">

<tr>
<td colspan="3">
분석 버튼을 눌러주세요.
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

const stopWords = [
"is","are","the","of","a","an","and","to","in",
"이","그","저","것","수","등","들","은","는","이","가"
];

function normalizeWord(word){

    return word
        .replace(/[.,!?]/g,'')
        .replace(/(입니다|이다|하는|했다|한다)$/,'')
        .replace(/(ing|ed|s)$/,'');

}

function preprocess(text){

    return text
        .toLowerCase()
        .split(/\s+/)
        .map(normalizeWord)
        .filter(word =>
            word.length > 1 &&
            !stopWords.includes(word)
        );
}

async function translateToKorean(text){

    try{

        const url =
`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`;

        const response = await fetch(url);

        const data = await response.json();

        return data.responseData.translatedText;

    }catch(error){

        console.log("번역 실패");

        return null;
    }
}

function createFrequencyVector(tokens){

    let vec = {};

    tokens.forEach(word=>{

        vec[word] = (vec[word] || 0) + 1;

    });

    return vec;
}

function cosineSimilarity(vec1,vec2,allWords){

    let dot=0;
    let norm1=0;
    let norm2=0;

    allWords.forEach(word=>{

        const a = vec1[word] || 0;
        const b = vec2[word] || 0;

        dot += a*b;
        norm1 += a*a;
        norm2 += b*b;

    });

    if(norm1===0 || norm2===0){
        return 0;
    }

    return dot / (Math.sqrt(norm1)*Math.sqrt(norm2));
}

function buildPageRank(tokens){

    let graph = {};
    let scores = {};

    tokens.forEach(word=>{

        graph[word] = new Set();
        scores[word] = 1;

    });

    for(let i=0;i<tokens.length-1;i++){

        const a = tokens[i];
        const b = tokens[i+1];

        graph[a].add(b);
        graph[b].add(a);

    }

    for(let step=0;step<20;step++){

        let newScores = {};

        Object.keys(graph).forEach(word=>{

            let sum = 0;

            graph[word].forEach(neighbor=>{

                sum += scores[neighbor];

            });

            newScores[word] =
                0.15 + 0.85 * sum;

        });

        scores = newScores;
    }

    return scores;
}

function weightedVector(tokens,pagerank){

    let vec = {};

    tokens.forEach(word=>{

        vec[word] =
            (vec[word] || 0) + pagerank[word];

    });

    return vec;
}

function createGraph(allTokens, tokenGroups, pageRanks){

    let elements = [];

    allTokens.forEach(word=>{

        let weight = 1;

        pageRanks.forEach(pr=>{

            weight += pr[word] || 0;

        });

        elements.push({

            data:{
                id:word,
                weight:weight
            }

        });

    });

    tokenGroups.forEach(tokens=>{

        for(let i=0;i<tokens.length-1;i++){

            elements.push({

                data:{
                    source:tokens[i],
                    target:tokens[i+1]
                }

            });

        }

    });

    cytoscape({

        container:document.getElementById('cy'),

        elements:elements,

        style:[

            {
                selector:'node',

                style:{

                    'label':'data(id)',

                    'width':
                    'mapData(weight,1,30,30,90)',

                    'height':
                    'mapData(weight,1,30,30,90)',

                    'background-color':'#10b981',

                    'text-valign':'center',

                    'text-halign':'center',

                    'font-size':'12px',

                    'color':'#0f172a',

                    'font-weight':'bold'
                }
            },

            {
                selector:'edge',

                style:{

                    'width':2,

                    'line-color':'#cbd5e1',

                    'curve-style':'bezier',

                    'opacity':0.7
                }
            }

        ],

        layout:{
            name:'cose',
            padding:20
        }

    });
}

async function analyzeTexts(){

    let text1 =
        document.getElementById('text1').value;

    const text2 =
        document.getElementById('text2').value;

    const text3 =
        document.getElementById('text3').value;

    let translationSuccess = true;

    if(/[a-zA-Z]/.test(text1)){

        const translated =
            await translateToKorean(text1);

        if(translated){

            text1 = translated;

        }else{

            translationSuccess = false;

        }
    }

    const t2 = preprocess(text2);
    const t3 = preprocess(text3);

    if(!translationSuccess){

        const allWords =
            Array.from(new Set([...t2,...t3]));

        const vec2 =
            createFrequencyVector(t2);

        const vec3 =
            createFrequencyVector(t3);

        const base23 =
            cosineSimilarity(vec2,vec3,allWords);

        const pr2 = buildPageRank(t2);
        const pr3 = buildPageRank(t3);

        const wvec2 =
            weightedVector(t2,pr2);

        const wvec3 =
            weightedVector(t3,pr3);

        const new23 =
            cosineSimilarity(
                wvec2,
                wvec3,
                allWords
            );

        document.getElementById('resultTable').innerHTML = `

        <tr>
        <td colspan="3">
        영어 번역 실패 → 한국어 문장끼리만 분석합니다.
        </td>
        </tr>

        <tr>
            <td>2번 ↔ 3번</td>
            <td>${(base23*100).toFixed(1)}%</td>
            <td class="highlight">
            ${(new23*100).toFixed(1)}%
            </td>
        </tr>

        `;

        createGraph(
            allWords,
            [t2,t3],
            [pr2,pr3]
        );

        return;
    }

    const t1 = preprocess(text1);

    const allWords =
        Array.from(new Set([
            ...t1,...t2,...t3
        ]));

    const vec1 =
        createFrequencyVector(t1);

    const vec2 =
        createFrequencyVector(t2);

    const vec3 =
        createFrequencyVector(t3);

    const base12 =
        cosineSimilarity(vec1,vec2,allWords);

    const base13 =
        cosineSimilarity(vec1,vec3,allWords);

    const base23 =
        cosineSimilarity(vec2,vec3,allWords);

    const translatedTokens = preprocess(text1);

    const translatedVec =
        createFrequencyVector(translatedTokens);

    const baseT2 =
        cosineSimilarity(translatedVec,vec2,allWords);

    const baseT3 =
        cosineSimilarity(translatedVec,vec3,allWords);

    const pr1 = buildPageRank(t1);
    const pr2 = buildPageRank(t2);
    const pr3 = buildPageRank(t3);

    const wvec1 =
        weightedVector(t1,pr1);

    const wvec2 =
        weightedVector(t2,pr2);

    const wvec3 =
        weightedVector(t3,pr3);

    const new12 =
        cosineSimilarity(wvec1,wvec2,allWords);

    const new13 =
        cosineSimilarity(wvec1,wvec3,allWords);

    const new23 =
        cosineSimilarity(wvec2,wvec3,allWords);

    const newT2 =
        cosineSimilarity(wvec1,wvec2,allWords);

    const newT3 =
        cosineSimilarity(wvec1,wvec3,allWords);

    document.getElementById('resultTable').innerHTML = `

    <tr>
        <td>1번 ↔ 2번</td>
        <td>${(base12*100).toFixed(1)}%</td>
        <td class="highlight">
        ${(new12*100).toFixed(1)}%
        </td>
    </tr>

    <tr>
        <td>1번 ↔ 3번</td>
        <td>${(base13*100).toFixed(1)}%</td>
        <td class="highlight">
        ${(new13*100).toFixed(1)}%
        </td>
    </tr>

    <tr>
        <td>2번 ↔ 3번</td>
        <td>${(base23*100).toFixed(1)}%</td>
        <td class="highlight">
        ${(new23*100).toFixed(1)}%
        </td>
    </tr>

    <tr>
        <td>자동번역 ↔ 2번</td>
        <td>${(baseT2*100).toFixed(1)}%</td>
        <td class="highlight">
        ${(newT2*100).toFixed(1)}%
        </td>
    </tr>

    <tr>
        <td>자동번역 ↔ 3번</td>
        <td>${(baseT3*100).toFixed(1)}%</td>
        <td class="highlight">
        ${(newT3*100).toFixed(1)}%
        </td>
    </tr>

    `;

    createGraph(
        allWords,
        [t1,t2,t3],
        [pr1,pr2,pr3]
    );
}

</script>

</body>
</html>
